<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="Author" content="Ahmed Mohammed">
        <meta name="Description" content="Taco Shop Contact">
        <title>Contact Us - LTS</title>
        <link rel="icon" href="img/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>
    <body>
        <header>
            <h1>Contact Us</h1>
        
            <nav>
                <h2>Content</h2>
                <ul>
                    <li><a href="index.html">Home Page</a></li>
                    <li><a href="index.html#about-lts">About LTS</a></li>
                    <li><a href="index.html#our-menu">Our Menu</a></li>
                    <li><a href="hours.html">Store Hours</a></li>
                </ul>
            </nav>
            <figure>
                <img src="img/tacos_close_up_400x260.png" alt="Little Taco shop Tacos" title="Little Taco shop Tacos" width="400">
                <figcaption>Little Taco shop Tacos</figcaption>
            </figure>
            <hr>
        </header>
        <main>
            <section>
                <h2>Our Contact Form</h2>
                <form action="https://httpbin.org/get">
                    <fieldset>
                        <legend>Send Us A Message</legend>

                        <p>
                            <label for="name">Name: </label>
                            <input type="text" name="name" id="name" placeholder="Your Name">
                        </p>

                        <p>
                            <label for="email">Email: </label>
                            <input type="text" name="email" id="email" placeholder="name@mail.com">
                        </p>

                        <p>
                            <label for="your-message">Your Message</label> <br>
                            <textarea name="your-message" id="your-message" placeholder="Enter your message here .." rows="10" cols="60"></textarea>
                        </p>
                        <p>
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                        </p>

                    </fieldset>
                </form>
            </section>
        </main>
        <footer>
            <p>
                <a href="#">Back To the Top</a>
            </p>
            <hr>
            <p>
                Copyright &copy; The Little Taco Shop
            </p>
        </footer>
    </body>
</html>
